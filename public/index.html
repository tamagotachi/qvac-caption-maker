<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Caption Maker</title>
<style>
  :root { --bg: #fdf4ff; --ink: #2b1633; --muted: #7a6384; --line: #efd9f5; --card: #fff; --grad: linear-gradient(135deg, #f76707, #e64980, #7048e8); --pink: #d6336c; --green: #2b8a3e; --red: #e03131; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 26px 16px 56px; }
  h1 { font: 900 36px/1.05 system-ui, sans-serif; margin: 0; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; } .sub { color: var(--muted); margin: 6px 0 8px; }
  #status { font-size: 13px; color: var(--muted); margin: 0 0 12px; } #status.ok { color: var(--green); } #status.err { color: var(--red); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; } .panel h2 { font-size: 17px; margin: 0 0 8px; }
  textarea, select { font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); } textarea { width: 100%; min-height: 90px; resize: vertical; }
  textarea:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #e599f7; outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border: 0; border-radius: 12px; background: var(--grad); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); padding: 5px 11px; font-size: 13px; } button.busy { opacity: .55; cursor: progress; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; } .row label.chk { display: flex; gap: 6px; align-items: center; font-weight: 600; } .row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--pink); }
  .note { color: var(--muted); font-size: 14px; min-height: 20px; margin: 8px 0 0; }
  .cap { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; } .cap p { margin: 0 0 6px; white-space: pre-wrap; font-size: 16px; } .cap .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .count { font-weight: 700; } .count.ok { color: var(--green); } .count.over { color: var(--red); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; } .tags button { background: #fff; color: #862e9c; border: 1px solid #e599f7; border-radius: 99px; padding: 3px 10px; font-size: 13px; font-weight: 700; } .tags button.on { background: #862e9c; color: #fff; }
  .fine { color: var(--muted); font-size: 13px; } .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Social Caption Maker</h1>
  <p class="sub">Describe your photo or post. Get captions in your style, pick your hashtags, and copy it all with one tap.</p>
  <p id="status">Checking the AI caption writer...</p>
  <section class="panel">
    <textarea id="about" maxlength="600" placeholder="What's in your post? e.g. sunset at the beach with my best friends after our last exam" aria-label="Describe your post"></textarea>
    <div class="row"><label for="platform">Platform</label><select id="platform"><option value="Instagram">Instagram</option><option value="X">X / Twitter</option><option value="LinkedIn">LinkedIn</option><option value="TikTok">TikTok</option><option value="Facebook">Facebook</option></select>
      <label for="vibe">Vibe</label><select id="vibe"><option value="funny">Funny</option><option value="aesthetic">Aesthetic</option><option value="inspiring">Inspiring</option><option value="cozy">Cozy</option><option value="professional">Professional</option></select>
      <label class="chk"><input type="checkbox" id="emojis" checked> Emojis</label><button id="go">Write captions</button></div>
    <p class="note" id="note"></p>
  </section>
  <section class="panel hidden" id="tagBox"><h2>Hashtags <small class="fine">(tap to add or remove, <span id="tagCount">0</span> picked)</small></h2><div class="tags" id="tags"></div></section>
  <section id="caps" aria-live="polite"></section>
  <p class="fine">Character counts are a guide. Check each app's current limits, since they change.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const LIMITS = { X: 280, Instagram: 2200, LinkedIn: 3000, TikTok: 2200, Facebook: 5000 };
let caps = [], tags = [], picked = new Set(), busy = false, ai = { ready: false, message: "Loading...", percent: null, error: null };
const count = (s) => [...s].length;
const full = (c) => c + (picked.size ? "\n\n" + [...picked].join(" ") : "");

function draw() {
  const lim = LIMITS[$("platform").value], box = $("caps"); box.innerHTML = "";
  caps.forEach((c) => { const d = document.createElement("div"); d.className = "cap panel"; const p = document.createElement("p"); p.textContent = full(c); const m = document.createElement("div"); m.className = "meta"; const n = count(full(c));
    const cnt = document.createElement("span"); cnt.className = "count " + (n > lim ? "over" : "ok"); cnt.textContent = n + " / " + lim + (n > lim ? " \u00b7 too long for " + $("platform").value : "");
    const cp = document.createElement("button"); cp.className = "ghost"; cp.textContent = "Copy caption + hashtags"; cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(full(c)); cp.textContent = "Copied!"; } catch { cp.textContent = "Press Ctrl+C"; } setTimeout(() => (cp.textContent = "Copy caption + hashtags"), 1200); });
    m.append(cnt, cp); d.append(p, m); box.append(d); });
  $("tagBox").classList.toggle("hidden", !tags.length); const tb = $("tags"); tb.innerHTML = "";
  tags.forEach((t) => { const b = document.createElement("button"); b.textContent = t; b.className = picked.has(t) ? "on" : ""; b.setAttribute("aria-pressed", picked.has(t)); b.addEventListener("click", () => { picked.has(t) ? picked.delete(t) : picked.add(t); draw(); }); tb.append(b); });
  $("tagCount").textContent = picked.size;
}
$("platform").addEventListener("change", draw);

// Simple captions for when the AI isn't ready yet
function template(about) {
  const e = $("emojis").checked, t = about.replace(/\s+/g, " ").trim().replace(/[.!]$/, ""), T = t[0].toUpperCase() + t.slice(1);
  const words = [...new Set((about.toLowerCase().match(/[a-z]{4,}/g) || []).filter((w) => !["with", "after", "that", "this", "from", "have", "their", "about"].includes(w)))].slice(0, 6);
  return { captions: [T + (e ? " \u2728" : "."), "Not a bad way to spend the day" + (e ? " \ud83d\ude0c" : "."), "Moments like this " + (e ? "\ud83d\udcab" : "") + "\n" + T + ".", "Saving this memory forever" + (e ? " \ud83d\udcf8" : ".")], hashtags: words.map((w) => "#" + w) };
}
async function write() {
  if (busy) return; const about = $("about").value.trim(); if (about.length < 5) { $("note").textContent = "Describe your post first."; return $("about").focus(); }
  let r;
  if (!ai.ready) { r = template(about); $("note").textContent = (ai.error ? "The AI isn't available" : "The AI is still loading" + (ai.percent != null ? " (" + ai.percent + "%)" : "")) + ", so these are simple templates."; }
  else { busy = true; $("go").classList.add("busy"); $("note").textContent = "Writing captions...";
    try { const res = await fetch("/api/captions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ about, platform: $("platform").value, vibe: $("vibe").value, emojis: $("emojis").checked }) }); r = await res.json(); if (!res.ok) throw new Error(r.error); $("note").textContent = "Captions by the on-device AI. Tap hashtags to add them."; }
    catch (err) { r = template(about); $("note").textContent = "The AI had a problem (" + err.message + "), so these are simple templates."; }
    busy = false; $("go").classList.remove("busy"); }
  caps = r.captions; tags = r.hashtags; picked = new Set(tags.slice(0, $("platform").value === "LinkedIn" || $("platform").value === "X" ? 2 : 5)); draw();
}
$("go").addEventListener("click", write); $("about").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); write(); } });

async function checkStatus() {
  try { ai = await (await fetch("/api/status")).json();
    if (ai.error) return setStatus("AI error: " + ai.error + ". Simple templates still work.", "err");
    if (ai.ready) return setStatus("AI caption writer ready. It runs on your device.", "ok");
    setStatus(ai.message + (ai.percent != null ? " " + ai.percent + "%" : "") + " Simple templates work meanwhile.");
  } catch { ai = { ready: false, error: "the server can't be reached" }; setStatus("Can't reach the server. Open http://localhost:3092 and make sure npm start is running.", "err"); return; }
  setTimeout(checkStatus, 1500);
}
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }
checkStatus();
</script>
</body>
</html>
